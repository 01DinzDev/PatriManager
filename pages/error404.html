<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>
    
    <div id="container1">

        <h1>404</h1>
        <div id="div1">
            <h2>Página indisponível</h2>
            <p> Esta página ainda não está disponível ou está em desenvolvimento.</p>
        </div>

        <button id="btn-voltar" >Voltar</button>

    </div>

    <script>
        const btnVoltar = document.getElementById("btn-voltar");

        btnVoltar.addEventListener("click", () => {
            history.back();
        });
    </script>
